name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          # The CPU index keeps this to ~200MB instead of pulling the CUDA stack.
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install numpy pandas scikit-learn opencv-python-headless pillow \
                      albumentations matplotlib tqdm PyYAML

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Every module imports
        # scripts/explainability/grad_cam.py used to torch.load a nonexistent
        # checkpoint at import scope, so it could not be imported at all. Nothing
        # noticed, because nothing ever tried.
        run: |
          fail=0
          for f in $(find scripts frontend -name '*.py' -not -path '*/__pycache__/*' | sort); do
            m=$(echo "$f" | sed 's|^scripts/||; s|^frontend/|frontend.|; s|/|.|g; s|\.py$||')
            case "$m" in frontend.*) P=".";; *) P="scripts";; esac
            PYTHONPATH="$P:." python -c "import $m" >/dev/null 2>&1 \
              || { echo "::error file=$f::cannot be imported"; fail=1; }
          done
          exit $fail

      - name: Every CLI starts
        # visualize_augmentations.py crashed on --help for months: the package
        # scripts/preprocessing/ shadowed the module preprocessing.py.
        run: |
          fail=0
          for f in $(grep -rl argparse --include='*.py' scripts/ dataset_builder/ tools/ | sort); do
            PYTHONPATH="scripts:dataset_builder:." timeout 120 python "$f" --help >/dev/null 2>&1 \
              || { echo "::error file=$f::--help failed"; fail=1; }
          done
          exit $fail
